services:
  - type: web
    name: cs-ircfs-platform
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: REQUIRE_API_KEY
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: cs-ircfs-postgres
          property: connectionString
      - key: API_KEY_ROLES
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      # The dashboard is served by this service (same origin), so no cross-origin access.
      - key: CORS_ORIGINS
        value: ""
      # Africa's Talking callback secret: https://<service>.onrender.com/api/v1/ussd?token=<value>
      - key: GATEWAY_CALLBACK_TOKEN
        generateValue: true
      # Render's load balancer sets X-Forwarded-For; trust it so rate limits see real client addresses.
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      # Field channels stay in dry-run (logged, not delivered) until Africa's Talking is configured.
      - key: SMS_PROVIDER
        value: dry_run
      - key: AIRTIME_PROVIDER
        value: dry_run
      - key: AFRICAS_TALKING_USERNAME
        sync: false
      - key: AFRICAS_TALKING_API_KEY
        sync: false
      - key: SMS_SENDER_ID
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      # Public Mapbox token (pk.…) for the dashboard map, restricted to this site's URL in Mapbox.
      - key: MAPBOX_ACCESS_TOKEN
        sync: false

databases:
  - name: cs-ircfs-postgres
    plan: free
    databaseName: cs_ircfs
    user: cs_ircfs
