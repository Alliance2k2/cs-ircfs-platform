<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CS-IRCFS | Create account</title><style>body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#183c72,#4f63e8);padding:30px 16px;color:#10233d}.card{max-width:650px;margin:auto;background:#fff;border-radius:10px;padding:40px;box-shadow:0 12px 35px #071d5c66}h1{margin:20px 0 8px}.sub{color:#65728a}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{display:block;font-weight:700;margin:16px 0}.field input,.field select{display:block;width:100%;height:48px;margin-top:8px;padding:0 12px;border:1px solid #cbd0dc;border-radius:7px;font-size:16px}.wide{grid-column:1/-1}.button{width:100%;height:52px;background:#0b7055;color:#fff;border:0;border-radius:8px;font-size:17px;font-weight:700;margin-top:14px}.note{background:#eef7f2;padding:14px;border-radius:7px;color:#265d49}.links{margin-top:22px}.links a{color:#2754d8;font-weight:700}@media(max-width:560px){.card{padding:25px}.grid{display:block}}</style></head><body><main class="card"><strong style="color:#0c6b50;letter-spacing:1px">CS-IRCFS · BUGESERA AGRICULTURE DATA CENTRE</strong><h1>Create your account</h1><p class="sub">Request access to monitoring, cooperative, and district planning tools.</p><form><div class="grid" style="display:block"><label class="field">First name<input required name="first_name" autocomplete="given-name"></label><label class="field">Middle name<input name="middle_name" autocomplete="additional-name"></label><label class="field">Surname<input required name="surname" autocomplete="family-name"></label><label class="field wide">Phone number<input required name="phone_number" type="tel" placeholder="+250788123456"></label><label class="field wide">Email address<input required name="email" type="email" placeholder="you@example.com"></label><label class="field wide">Password<input required name="password" id="password" type="password" minlength="8"><small>Use at least 8 characters, one uppercase letter, one lowercase letter, one number, and one symbol such as # or !.</small></label><label class="field wide">Confirm password<input required name="confirm_password" id="confirm-password" type="password"></label></div><p class="note">Your account request will be reviewed by a platform administrator.</p><button class="button" type="submit">Create account</button></form><p class="links">Already have an account? <a href="login.html">Sign in</a></p></main><script>
const form=document.querySelector("form"),note=document.querySelector(".note"),password=document.querySelector("#password"),confirmPassword=document.querySelector("#confirm-password");
const req=document.createElement("div"); req.style="font-size:13px;line-height:1.7;margin-top:6px"; password.parentElement.append(req);
function check(){const v=password.value,c=confirmPassword.value,items=[[/[A-Z]/,"Uppercase letter"],[/[a-z]/,"Lowercase letter"],[/\d/,"Number"],[/[^A-Za-z0-9]/,"Symbol"],[/.{8,}/,"8+ characters"]];req.innerHTML=items.map(([r,t])=>`<div style="color:${r.test(v)?"#16834f":"#c62828"}">${r.test(v)?"?":"?"} ${t}</div>`).join("")+`<div style="color:${c&&c===v?"#16834f":"#c62828"}">${c&&c===v?"?":"?"} Passwords match</div>`}
password.addEventListener("input",check);confirmPassword.addEventListener("input",check);
form.addEventListener("submit",async e=>{e.preventDefault();check();if(password.value!==confirmPassword.value){note.textContent="Passwords do not match.";return}if(!/(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,}/.test(password.value)){note.textContent="Complete all password requirements first.";return}const f=new FormData(form);try{const r=await fetch("/api/v1/auth/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({first_name:f.get("first_name"),surname:f.get("surname"),middle_name:f.get("middle_name"),email:f.get("email"),password:f.get("password")})});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||"Registration failed");note.textContent="Account created successfully. You can now sign in.";form.reset();check()}catch(err){note.textContent=err.message}});
</script></body></html>
