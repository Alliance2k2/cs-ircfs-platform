  <body data-page="trends">
    <div class="app-layout">
      <aside class="app-sidebar" data-app-sidebar></aside>
      <div class="app-main">
        <header class="app-topbar" data-app-topbar></header>
        <main class="app-content">
          <div id="connection-notice" class="connection-notice" role="status" hidden></div>
          <header class="app-hero compact">
            <div class="app-hero-copy">
              <p class="eyebrow">MONTH BY MONTH</p>
              <h1>Trends</h1>
              <p>The last 12 months of field evidence. Hover or tab into a chart for exact values.</p>
              <div class="app-hero-stats"><div><b id="stat-trend-reports">–</b><span>reports in 12 months</span></div><div><b id="stat-trend-rain">–</b><span>mm rain recorded</span></div><div><b id="stat-trend-cases">–</b><span>cases resolved</span></div><div><b id="stat-trend-harvest">–</b><span>t harvest reported</span></div></div>
            </div>
            <div class="header-actions"><button id="trends-table-toggle" type="button" class="app-hero-link ghost"><i class="bi bi-table" aria-hidden="true"></i> Show as table</button><a class="app-hero-link" href="report.html"><i class="bi bi-file-earmark-bar-graph" aria-hidden="true"></i> Monthly report</a></div>
          </header>

          <section class="panel trends-panel">
            <p id="trends-status" class="subtle"></p>
            <div class="trend-grid">
              <figure class="trend"><figcaption><b>Field reports</b><span>per month, USSD, SMS and web</span></figcaption><div class="trend-chart" id="trend-reports"></div></figure>
              <figure class="trend"><figcaption><b>Rainfall</b><span>mm per month, average per rain gauge</span></figcaption><div class="trend-chart" id="trend-rain"></div></figure>
              <figure class="trend"><figcaption><b>Act Now cases</b><span>opened and resolved per month</span></figcaption><div class="trend-chart" id="trend-cases"></div></figure>
              <figure class="trend"><figcaption><b>Harvest</b><span>expected and reported tons per month</span></figcaption><div class="trend-chart" id="trend-harvest"></div></figure>
              <figure class="trend"><figcaption><b>Planting updates</b><span>crop reports with a planting date, per month</span></figcaption><div class="trend-chart" id="trend-plantings"></div></figure>
            </div>
            <div id="trends-table" class="trend-table-wrap" hidden></div>
          </section>
        </main>
        <footer class="app-footer" data-app-footer></footer>
      </div>
    </div>
    <div class="app-backdrop" data-app-backdrop hidden></div>
