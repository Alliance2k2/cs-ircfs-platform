name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      # A clean install catches a missing dependency (slowapi was missing before October 2026).
      - run: pip install -r requirements.txt
      - name: Tests (in-memory SQLite, telecom forced to dry-run)
        run: python -m pytest -q
      - name: Dependency audit (advisory)
        continue-on-error: true
        run: pip install pip-audit && pip-audit -r requirements.txt

  migrations:
    name: Migrations on PostGIS
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: cs_ircfs
          POSTGRES_USER: cs_ircfs
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cs_ircfs -d cs_ircfs"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://cs_ircfs:ci-only-password@localhost:5432/cs_ircfs
      ENVIRONMENT: staging
      WEATHER_FORECAST_ENABLED: "false"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Upgrade to head
        run: alembic upgrade head
      - name: Downgrade one step and upgrade again
        run: alembic downgrade -1 && alembic upgrade head
      - name: Seed reference schemes and demonstration data
        run: python scripts/seed_reference_schemes.py && python scripts/seed_demo_data.py

  frontend:
    name: Frontend checks and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Dependency audit (advisory)
        continue-on-error: true
        run: npm audit --omit=dev

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag cs-ircfs:ci .
