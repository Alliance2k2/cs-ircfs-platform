name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      target_url:
        description: "Deployed staging or production base URL to verify after deployment"
        required: false
        type: string
      deployment_environment:
        description: "Deployment environment"
        required: true
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      # A clean install catches a missing dependency (slowapi was missing before October 2026).
      - run: pip install -r requirements.txt
      - name: Tests (in-memory SQLite, telecom forced to dry-run)
        run: python -m pytest -q
      - name: Dependency audit (advisory)
        continue-on-error: true
        run: pip install pip-audit && pip-audit -r requirements.txt

  migrations:
    name: Migrations on PostGIS
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: cs_ircfs
          POSTGRES_USER: cs_ircfs
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cs_ircfs -d cs_ircfs"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://cs_ircfs:ci-only-password@localhost:5432/cs_ircfs
      ENVIRONMENT: staging
      WEATHER_FORECAST_ENABLED: "false"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Upgrade a fresh database to head
        run: alembic upgrade head && alembic current
      - name: Compare the migrated schema with the models
        run: python scripts/check_schema.py
      - name: Downgrade one step and upgrade again
        run: alembic downgrade -1 && alembic upgrade head
      - name: Seed reference schemes and demonstration data
        # --yes: on PostgreSQL the demo seed asks for confirmation, and CI has no one to answer.
        run: python scripts/seed_reference_schemes.py && python scripts/seed_demo_data.py --yes

  frontend:
    name: Frontend checks and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Dependency audit (advisory)
        continue-on-error: true
        run: npm audit --omit=dev

  e2e:
    name: Browser end-to-end workflows
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    defaults:
      run:
        working-directory: frontend
    env:
      PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r ../backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # backend/scripts/run_e2e_server.py: temporary SQLite, real sign-in, SMS/airtime dry-run, no external calls.
      - run: npm run e2e
      - name: Keep the report when a workflow fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag cs-ircfs:ci .

  deployment-readiness:
    name: Verify deployed environment
    if: github.event_name == 'workflow_dispatch' && inputs.target_url != ''
    runs-on: ubuntu-latest
    needs: [backend, migrations, frontend, e2e, docker]
    environment: ${{ inputs.deployment_environment }}
    steps:
      - name: Wait for database-ready response
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --retry 3 --retry-delay 10 "$TARGET_URL/ready"; then
              exit 0
            fi
            sleep 10
          done
          echo "Deployment never became database-ready" >&2
          exit 1
        env:
          TARGET_URL: ${{ inputs.target_url }}
