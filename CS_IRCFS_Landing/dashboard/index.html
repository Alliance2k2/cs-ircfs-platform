<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CS-IRCFS | Platform Design Prototype</title><style>
:root{--forest:#075638;--deep:#043e2c;--green:#138d58;--bright:#34b879;--mint:#e9f7ed;--bg:#f4f8f5;--line:#e5eee7;--ink:#18362b;--muted:#718578;--warning:#f5a43b;--red:#d95454}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,Arial;color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer}.shell{display:flex;min-height:100vh}.side{width:246px;background:linear-gradient(170deg,#08472f,#003924);color:#d5ece0;padding:22px 13px;position:sticky;top:0;height:100vh;overflow:auto;flex-shrink:0}.brand{display:flex;align-items:center;gap:10px;color:white;margin:4px 10px 27px}.mark{width:44px;height:44px}.brand b{font-size:19px;letter-spacing:-.4px}.brand small{display:block;color:#b2d9c4;font-size:10px}.navlabel{font-size:10px;color:#8cbca4;text-transform:uppercase;letter-spacing:1.6px;margin:22px 12px 7px}.nav{display:flex;gap:11px;align-items:center;width:100%;border:0;background:transparent;color:#c5e1d3;text-align:left;padding:11px 13px;border-radius:10px;margin:2px 0}.nav:hover,.nav.active{background:#177c51;color:white}.nav.active{box-shadow:inset 3px 0 #86e6ae}.nav span{font-size:17px;width:23px;text-align:center}.sidefooter{padding:17px 12px;color:#a9cfbd;font-size:11px;border-top:1px solid #29684b;margin-top:25px}.main{flex:1;min-width:0}.top{height:74px;background:#fff;border-bottom:1px solid var(--line);padding:0 32px;display:flex;align-items:center;justify-content:space-between;gap:15px}.crumb{color:#9aaa9f}.crumb strong{color:#234b36}.search{border:1px solid var(--line);background:#f6f9f7;padding:10px 16px;border-radius:9px;width:min(310px,40vw)}.avatar{border-radius:50%;background:var(--mint);color:var(--forest);padding:10px;font-weight:800}.topright{display:flex;align-items:center;gap:17px}.content{max-width:1700px;margin:auto;padding:30px 34px 70px}.eyebrow{font-size:11px;color:var(--green);font-weight:800;letter-spacing:1.7px;text-transform:uppercase}.heading{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:22px;flex-wrap:wrap}.heading h1{font-size:29px;line-height:1.2;margin:3px 0 7px;letter-spacing:-.8px}.sub{color:var(--muted);margin:0}.controls{display:flex;gap:8px;flex-wrap:wrap}.pill,.btn{padding:9px 14px;border-radius:9px;border:1px solid #dce9df;background:white;color:#39634e;font-weight:650}.btn{background:var(--forest);color:white;border-color:var(--forest)}.btn:hover{background:#0c744a}.grid{display:grid;gap:18px}.kpis{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:20px}.panel{background:white;border:1px solid var(--line);border-radius:16px;box-shadow:0 5px 24px #244e2c06;padding:22px;min-width:0}.kpi{min-height:135px}.kpi .ico{width:38px;height:38px;border-radius:12px;background:#e6f7ec;color:#0e9253;display:grid;place-items:center;font-size:20px;margin-bottom:13px}.kpi b{font-size:26px;letter-spacing:-.7px}.kpi small{display:block;color:var(--muted);font-size:12px}.tag{font-size:11px;font-weight:700;background:#e5f8ed;color:#18824b;border-radius:30px;padding:4px 9px;display:inline-block}.warn{background:#fff1db;color:#a96912}.bad{background:#fdecec;color:#bb4545}.title{font-size:16px;font-weight:800;margin:0 0 5px}.help{color:var(--muted);font-size:12px;margin:0 0 17px}.cols{grid-template-columns:1.45fr 1fr}.cols2{grid-template-columns:1fr 1fr}.map{height:305px;position:relative;overflow:hidden;border:1px solid #d5e6d7;border-radius:13px;background:radial-gradient(ellipse at 15% 50%,#d1e8ce 0%,transparent 37%),radial-gradient(ellipse at 85% 80%,#d1e8ce 0%,transparent 39%),linear-gradient(115deg,#edf4db,#d4e8d5 58%,#eaf3df)}.map:before{content:"";position:absolute;inset:-20%;background:repeating-linear-gradient(150deg,transparent 0 44px,#ffffff70 45px 47px,transparent 48px 95px);transform:rotate(8deg)}.river{position:absolute;width:110%;height:40px;border-radius:60%;border-top:9px solid #6cc1c1;transform:rotate(-28deg);top:55%;left:-7%;opacity:.75}.location{position:absolute;z-index:2;background:white;box-shadow:0 5px 16px #385a4240;padding:6px 9px;border-radius:7px;font-size:11px;font-weight:750}.dot{width:10px;height:10px;background:#21a56a;border:2px solid white;display:inline-block;border-radius:50%;margin-right:5px;box-shadow:0 0 0 2px #21a56a}.m1{top:23%;left:43%}.m2{top:60%;left:22%}.m3{top:67%;left:68%}.mapname{position:absolute;z-index:1;bottom:10px;right:12px;background:#ffffffdc;padding:5px 8px;border-radius:7px;font-size:10px;color:#617c6a}.bars{display:flex;align-items:end;gap:16px;height:215px;padding:15px 10px 0;border-bottom:1px solid #e3ebe4;background:repeating-linear-gradient(to top,transparent 0 42px,#ebf1eb 43px 44px)}.barset{display:flex;align-items:end;justify-content:center;gap:5px;flex:1;height:100%;position:relative}.bar{width:15px;max-width:28%;border-radius:5px 5px 0 0;background:var(--green);height:var(--h)}.bar.light{background:#a0dabc}.barset label{position:absolute;bottom:-25px;font-size:11px;color:var(--muted)}.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);padding:37px 0 0}.key{display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--green);margin-right:5px}.key.light{background:#a0dabc}.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:12px}th{text-align:left;background:#f5f8f5;color:#72877a;font-weight:800;font-size:11px}td,th{padding:13px 12px;border-bottom:1px solid #edf2ed;white-space:nowrap}tr:last-child td{border:0}.progress{height:9px;background:#e8f1e9;border-radius:8px;overflow:hidden}.progress i{display:block;background:linear-gradient(90deg,#147c50,#5ac889);height:100%;width:var(--w)}.mini{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #edf2ed}.mini:last-child{border:0}.mini .emoji{width:38px;height:38px;background:#e8f6eb;border-radius:12px;display:grid;place-items:center;font-size:19px}.mini strong{display:block}.mini small{color:var(--muted)}.push{margin-left:auto}.donut{width:158px;height:158px;border-radius:50%;background:conic-gradient(#138d58 0 65%,#72c995 65% 85%,#ffb55a 85% 100%);display:grid;place-items:center;margin:20px auto}.donut div{width:112px;height:112px;background:white;border-radius:50%;display:grid;place-items:center;text-align:center;font-weight:800;font-size:23px}.donut small{display:block;font-weight:500;color:var(--muted);font-size:11px}.linechart{width:100%;height:180px}.featurehero{background:linear-gradient(110deg,#06462e,#138653);color:white;padding:28px;border-radius:17px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;gap:20px}.featurehero h2{font-size:23px;margin:0 0 6px}.featurehero p{margin:0;color:#d8f5e4}.notice{background:#f0f8f1;border:1px solid #cde7d2;border-radius:12px;padding:14px 17px;margin:19px 0;color:#3b704e}.cards3{grid-template-columns:repeat(3,minmax(0,1fr))}.field{border:1px solid #dde9e0;border-radius:11px;padding:12px 14px;background:#fcfefd;color:#567461;margin:8px 0}.flow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.flowstep{border-radius:12px;background:#edf7f0;padding:18px;flex:1;min-width:150px;text-align:center;font-weight:700}.arrow{color:var(--green);font-size:25px}.footnote{font-size:11px;color:#93a79b;margin-top:24px}.hamb{display:none}.hidden{display:none!important}@media(max-width:1050px){.side{width:205px}.kpis{grid-template-columns:repeat(2,1fr)}.cols,.cols2{grid-template-columns:1fr}.cards3{grid-template-columns:1fr 1fr}}@media(max-width:700px){.side{display:none;position:fixed;z-index:10;width:245px}.side.show{display:block}.hamb{display:block;background:var(--forest);color:white;border:0;border-radius:8px;padding:7px 11px}.top{padding:0 15px;height:65px}.search{display:none}.content{padding:20px 15px}.kpis,.cards3{grid-template-columns:1fr}.heading h1{font-size:25px}.featurehero{display:block}.avatar{display:none}}
</style></head><body><div class="shell"><aside class="side" id="side"><div class="brand"><svg class="mark" viewBox="0 0 100 100" fill="none"><circle cx="50" cy="50" r="44" stroke="#91e8b5" stroke-width="5"/><path d="M16 71Q43 42 84 71M22 78Q49 55 80 78" stroke="#91e8b5" stroke-width="6" stroke-linecap="round"/><path d="M52 17Q25 22 30 50Q55 53 52 17Z" fill="#74d89a"/><path d="M57 22C60 36 74 42 65 60C48 58 48 43 57 22Z" fill="#58c5d8"/><circle cx="77" cy="22" r="10" fill="#ffc366"/></svg><div><b>CS-IRCFS</b><small>Resilient communities</small></div></div><div class="navlabel">Workspace</div><div id="nav"></div><div class="sidefooter">AIMS Rwanda — KTT Office<br><br>Design prototype • illustrative data<br>Bugesera District, Rwanda</div></aside><main class="main"><header class="top"><div style="display:flex;align-items:center;gap:12px"><button class="hamb" onclick="document.getElementById('side').classList.toggle('show')">☰</button><div class="crumb">CS-IRCFS / <strong id="crumb">Overview</strong></div></div><div class="topright"><input class="search" placeholder="⌕  Search reports, sectors, schemes..."><span>🔔</span><span class="avatar">DP</span><span style="font-size:12px">District Planner<br><span style="color:#87998d">Demo account</span></span></div></header><section class="content" id="app"></section></main></div><script>
const items=[['overview','◫','Executive Dashboard'],['schemes','◉','Irrigation Schemes'],['citizens','♧','Citizen Reports'],['crops','❀','Crops & Yields'],['pests','⚑','Pests & Disease'],['nutrition','♡','Food Security'],['infrastructure','⚙','Infrastructure Health'],['climate','☁','Climate & Rainfall'],['advice','◷','Irrigation Advisory'],['feedback','▣','Community Feedback'],['outcomes','▥','Outcome Verification'],['analytics','▤','Analytics & Reports'],['monitors','♟','Monitors & Cooperatives'],['ussd','▦','USSD / SMS Console'],['settings','⚙','Settings']];
const $$=(s)=>document.querySelector(s);function kpi(icon,label,value,foot='Illustrative demo'){return `<div class="panel kpi"><div class="ico">${icon}</div><b>${value}</b><small>${label}</small><div style="margin-top:8px"><span class="tag">${foot}</span></div></div>`}function header(name,desc){return `<div class="heading"><div><div class="eyebrow">BUGESERA DISTRICT · MONITORING PLATFORM</div><h1>${name}</h1><p class="sub">${desc}</p></div><div class="controls"><button class="pill">◷ Pilot period</button><button class="pill">⌄ All schemes</button><button class="btn" onclick="alert('Design demo: export will be connected to the backend during implementation.')">↓ Export report</button></div></div>`}function panel(title,help,body){return `<div class="panel"><div class="title">${title}</div><p class="help">${help}</p>${body}</div>`}function map(){return `<div class="map"><div class="river"></div><div class="location m1"><span class="dot"></span>PADAB — Mwesa Valley</div><div class="location m2"><span class="dot"></span>APEFA — Ngeruka</div><div class="location m3"><span class="dot"></span>APEFA — Mareba</div><div class="mapname">Schematic only · not a geographic map</div></div>`}function bars(names=['Maize','Rice','Beans','Vegetables']){return `<div class="bars">${names.map((n,i)=>`<div class="barset"><div class="bar light" style="--h:${[74,89,63,77][i]}%"></div><div class="bar" style="--h:${[59,81,51,66][i]}%"></div><label>${n}</label></div>`).join('')}</div><div class="legend"><span><i class="key"></i>Reported (sample)</span><span><i class="key light"></i>Target (sample)</span></div>`}function trend(){return `<svg class="linechart" viewBox="0 0 500 180" preserveAspectRatio="none"><g stroke="#e3ebe4">${[30,70,110,150].map(y=>`<path d="M0 ${y}H500"/>`).join('')}</g><polyline points="5,135 85,100 170,119 250,65 330,90 415,42 495,54" fill="none" stroke="#14945d" stroke-width="4" stroke-linecap="round"/><polyline points="5,157 85,146 170,108 250,130 330,92 415,114 495,82" fill="none" stroke="#8bd5ab" stroke-width="4" stroke-linecap="round"/></svg><div class="legend"><span><i class="key"></i>Submitted reports</span><span><i class="key light"></i>Verified reports</span></div>`}function table(headers,rows){return `<div class="tablewrap"><table><thead><tr>${headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}const status=(s)=>`<span class="tag ${s==='Under review'?'warn':s==='Faulty'?'bad':''}">${s}</span>`;
const reports=[['RPT-001','Crop planting','Nyamata','PADAB',status('Verified')],['RPT-002','Rain gauge','Ngeruka','APEFA Solar',status('Verified')],['RPT-003','Pump downtime','Mwesa Valley','PADAB',status('Under review')],['RPT-004','Water pricing','Mareba','APEFA Solar',status('Under review')]];
const sections={overview:()=>`${header('Executive Dashboard','Citizen-powered insight into irrigation resilience and food security.') }<div class="featurehero"><div><div class="eyebrow" style="color:#8be4b1">PEOPLE • WATER • FOOD • RESILIENCE</div><h2>Better evidence. Smarter irrigation.<br>Stronger communities.</h2><p>Track two pilot irrigation schemes and close the feedback loop.</p></div><div style="font-size:64px">🌱💧</div></div><div class="grid kpis">${kpi('♧','Citizen reports','1,284','Sample data')}${kpi('♧','Active monitors','186','Sample data')}${kpi('💧','Infrastructure uptime','94%','Sample data')}${kpi('🌽','Projected yield achievement','82%','Sample data')}</div><div class="grid cols">${panel('Pilot scheme coverage','PADAB and APEFA Solar irrigation — location concept',map())}${panel('Reporting activity','Monthly citizen reporting trend · illustrative',trend())}</div><div class="grid cols2" style="margin-top:18px">${panel('Recent incoming reports','Latest demonstrations of low-bandwidth citizen reporting',table(['Reference','Type','Sector','Scheme','Status'],reports))}${panel('Priority decisions','Illustrative operational action queue',mini([['🚨','Mwesa pump downtime','Technical team investigation pending'],['🌾','Yield below projection','Review rice cooperative submissions'],['📩','Unresolved grievances','Send follow-up SMS after closure']]))}</div>`,schemes:()=>`${header('Irrigation Schemes','Scheme-by-scheme coverage of the PADAB and APEFA Solar pilot investments.')}<div class="grid cards3">${scheme('PADAB','Mwesa Valley','650 ha · 2 pumping stations · 65.5 km canals')}${scheme('APEFA Solar','Ngeruka','Solar-powered irrigation system')}${scheme('APEFA Solar','Mareba','Solar-powered irrigation system')}</div><div class="grid cols" style="margin-top:18px">${panel('Scheme location concept','Stylized district orientation — not surveyed asset coordinates',map())}${panel('Scheme health','Prototype components and review states',mini([['✅','PADAB pump inventory','Two stations in source proposal'],['💧','PADAB canal infrastructure','65.5 km in source proposal'],['☀️','APEFA solar irrigation','Ngeruka and Mareba sectors']]))}</div>`,citizens:()=>`${header('Citizen Science Reports','Crowdsourced evidence from farmers, cooperative leaders, and Citizen Science Monitors.')}<div class="grid kpis">${kpi('📲','SMS received','1,284','Sample data')}${kpi('✓','Verified logs','942','Sample data')}${kpi('⌛','Pending review','57','Sample data')}${kpi('👥','Cooperatives','3','Pilot target')}</div>${panel('Incoming citizen observations','Filter by scheme, sector, crop, report type, and verification status',table(['Reference','Type','Sector','Scheme','Status'],reports))}`,crops:()=>`${header('Crop Growth & Yield Forecasting','Compare citizen-reported production with feasibility-study yield projections.')}<div class="grid kpis">${kpi('🌾','Rice yield forecast','—','Await baseline')}${kpi('🌽','Maize reports','236','Sample data')}${kpi('🫘','Bean reports','157','Sample data')}${kpi('📈','Forecast confidence','—','Await training')}</div><div class="grid cols2">${panel('Reported vs target production','Illustrative comparison; NOT actual PADAB/APEFA yields',bars())}${panel('Crop observation trend','Sample reports by month',trend())}</div>`,pests:()=>`${header('Pest & Disease Alerts','Rapid detection of emerging crop risks reported by SMS.')}<div class="grid kpis">${kpi('⚑','Open pest alerts','14','Sample data')}${kpi('🐛','Fall armyworm reports','8','Sample data')}${kpi('🌿','Affected crop types','3','Sample data')}${kpi('✓','Alerts acknowledged','76%','Sample data')}</div><div class="grid cols">${panel('Pest alert coverage','Conceptual areas; heatmap needs verified farm locations',map())}${panel('Alert triage queue','Agricultural officer follow-up workflow',mini([['🐛','Fall armyworm','Nyamata · requires assessment'],['🍂','Suspected leaf blight','Ruhuha · awaiting agronomist'],['✅','Pest containment response','Mareba · sample follow-up']]))}</div>`,nutrition:()=>`${header('Household Food Security','Survey-driven visibility into food access and nutrition-related vulnerability.')}<div class="grid kpis">${kpi('🏠','Survey responses','412','Sample data')}${kpi('🥬','Food access coverage','71%','Sample data')}${kpi('🍽️','Households surveyed','412','Sample data')}${kpi('♡','Nutrition risk','—','Requires validation')}</div><div class="grid cols2">${panel('Illustrative dietary access categories','Demo split only; not a measured stunting rate',`<div class="donut"><div>71%<small>Sample adequate access</small></div></div>`)}${panel('Household survey themes','Use non-identifying aggregated statistics',mini([['🥗','Meal frequency','Short localized household questionnaire'],['🛒','Food accessibility','Availability and affordability'],['📉','Vulnerability tracking','Avoid diagnosing stunting from survey alone']]))}</div>`,infrastructure:()=>`${header('Infrastructure Health','Monitor water pumps, solar irrigation, canal faults, and downtime.')}<div class="grid kpis">${kpi('⚙','PADAB pumping stations','2','Document fact')}${kpi('〰','PADAB canals','65.5 km','Document fact')}${kpi('☀','APEFA pumping systems','—','Inventory needed')}${kpi('🚧','Open work orders','6','Sample data')}</div><div class="grid cols">${panel('Infrastructure overview','Schematic only; verify asset coordinates before real map use',map())}${panel('Fault classification','Technical, social, institutional, environmental',mini([['🔧','Technical','Broken valves and pump downtime'],['👥','Social','Distribution fairness and access'],['🏢','Institutional','Maintenance and management gaps'],['🌿','Environmental','Siltation and rainfall impacts']]))}</div>`,climate:()=>`${header('Climate & Rainfall Monitoring','Community rain gauges and locally calibrated drought-risk observations.')}<div class="grid kpis">${kpi('🌧','Rainfall readings','164','Sample data')}${kpi('☀','Drought alerts','3','Sample data')}${kpi('📍','Gauge locations','8','Sample data')}${kpi('💧','Rainfall total','—','Date range needed')}</div><div class="grid cols2">${panel('Rainfall report trend','Illustrative observations; no real sensor feed',bars(['May','June','July','Aug']))}${panel('Risk communication','Messages should be validated against seasonal data',mini([['🌦','Rain gauge submissions','From cooperative-designated observers'],['📱','SMS drought warnings','Triggered after approved thresholds'],['🗓','Seasonal comparisons','Train from PADAB/APEFA historical data']]))}</div>`,advice:()=>`${header('Irrigation Scheduling Assistant','Decision support built on local rainfall and historical drought patterns.')}<div class="featurehero"><div><h2>Water at the right time.</h2><p>Draft irrigation guidance, review thresholds, then deliver localized SMS advice.</p></div><div style="font-size:55px">💧</div></div><div class="grid cols2">${panel('Advice configuration','Prototype controls only',`<div class="field">Scheme: PADAB / APEFA Solar ▾</div><div class="field">Sector: Ngeruka / Mareba / Mwesa ▾</div><div class="field">Threshold source: Historical calibration required</div><button class="btn" onclick="alert('Demo only: no SMS will be sent.')">Preview SMS advisory</button>`)}${panel('Irrigation recommendation process','Human review before messaging',`<div class="flow"><div class="flowstep">Rainfall logs</div><span class="arrow">→</span><div class="flowstep">Validated rule</div><span class="arrow">→</span><div class="flowstep">Officer approval</div><span class="arrow">→</span><div class="flowstep">SMS</div></div>`)}</div>`,feedback:()=>`${header('Community Feedback & Grievances','Manage concerns, record action taken, and close the loop with affected communities.')}<div class="grid kpis">${kpi('▣','Submitted grievances','68','Sample data')}${kpi('⌛','Open cases','17','Sample data')}${kpi('✓','Resolved cases','51','Sample data')}${kpi('📩','Closure notices','34','Sample data')}</div>${panel('Feedback case management','Includes water pricing, distribution, land reallocation, and downstream impacts',table(['Case','Category','Location','Action','Status'],[['FB-001','Water distribution','Mwesa Valley','Follow-up assigned',status('Under review')],['FB-002','Water pricing','Ngeruka','Action recorded',status('Verified')],['FB-003','Downstream impact','Mareba','Review pending',status('Under review')]]))}`,outcomes:()=>`${header('Outcome Verification','Assess reported outcomes against project feasibility-study targets.')}<div class="notice">Outcome targets must be loaded from verified PADAB and APEFA source records. No results on this page represent verified impact estimates.</div><div class="grid kpis">${kpi('🌾','PADAB yield target','—','Source required')}${kpi('☀','APEFA yield target','—','Source required')}${kpi('📊','Baseline completeness','—','Source required')}${kpi('⚑','Bottleneck categories','4','Document fact')}</div><div class="grid cols2">${panel('Target-versus-reported illustration','Sample data only',bars())}${panel('Evaluation dimensions','Directly drawn from the platform proposal',mini([['📈','Achievement of expected outcomes','Compare crop estimates to feasibility targets'],['⚙','Bottlenecks','Classify technical, social, institutional, environmental'],['👥','Beneficiary feedback','Document concerns and response'],['🏞','Downstream impacts','Track land and resettlement impacts']]))}</div>`,analytics:()=>`${header('Analytics & Reports','Evaluation-ready insights for district planners and fellowship reporting.')}<div class="grid cards3">${['Scheme performance','Farmer reporting activity','Irrigation resilience','Household food security','Community accountability','Six-month pilot progress'].map((x,i)=>panel(x,'Configurable report',`<div style="font-size:36px;margin:15px 0">${['📊','📈','💧','🥬','🤝','🗓'][i]}</div><button class="pill" onclick="alert('Demo: reporting export is not connected.')">Preview template →</button>`)).join('')}</div>`,monitors:()=>`${header('Monitors & Cooperatives','Manage citizen monitors, training, reporting activity, and participating cooperatives.')}<div class="grid kpis">${kpi('👥','Target trained monitors','200','Proposal target')}${kpi('🏘','Pilot cooperatives','3','Proposal target')}${kpi('📲','Active monitors','186','Sample data')}${kpi('🎓','Training completion','—','Field data needed')}</div>${panel('Community Data Champions','Example table: real names and phone numbers are intentionally omitted',table(['Cooperative','Sector','Role','Training','Last activity'],[['Cooperative A','Nyamata','Data Champion',status('Verified'),'Sample date'],['Cooperative B','Ngeruka','Rain Gauge Monitor',status('Under review'),'Sample date'],['Cooperative C','Mareba','Irrigation Reporter',status('Verified'),'Sample date']]))}`,ussd:()=>`${header('USSD & SMS Console','Kinyarwanda-first reporting workflows for feature-phone and low-bandwidth users.')}<div class="grid cols2">${panel('USSD menu concept','Short codes *801# / 8448 are examples from the proposal, not confirmed allocations',`<div style="background:#08271c;color:#c9f7da;border-radius:20px;max-width:330px;margin:auto;padding:22px;box-shadow:0 13px 30px #17392330;font:15px/2 monospace"><div style="text-align:center;color:#86dda6">*801# · DEMO</div><br>Kaze kuri CS-IRCFS. Hitamo:<br>1. Rapora umusaruro / indwara<br>2. Rapora amazi n'imvura<br>3. Tanga ikibazo / igitekerezo<br><br><div style="background:#234a37;padding:6px">Shyiramo umubare: __</div></div>`)}${panel('Delivery flow','Architecture from project proposal',`<div class="flow"><div class="flowstep">Farmer<br>Feature phone</div><span class="arrow">→</span><div class="flowstep">USSD / SMS<br>Gateway</div><span class="arrow">→</span><div class="flowstep">Backend +<br>PostgreSQL</div><span class="arrow">→</span><div class="flowstep">District<br>Dashboard</div></div><div class="notice">No real telecom connectivity or messages in this prototype.</div>`)}</div>`,settings:()=>`${header('Settings & Administration','Role-aware platform preferences and configuration concepts.')}<div class="grid cols2">${pa function mini(arr){return arr.map(([emoji,title,body])=>`<div class="mini"><div class="emoji">${emoji}</div><div><strong>${title}</strong><small>${body}</small></div><span class="push" style="color:#0d9154">›</span></div>`).join('')}function scheme(name,place,desc){return `<div class="panel"><div class="eyebrow">Pilot investment</div><h2 style="margin:10px 0 2px">${name}</h2><strong>${place}</strong><p class="sub" style="margin:13px 0 18px">${desc}</p><div class="progress" style="--w:65%"><i></i></div><p class="help" style="margin:10px 0 0">Illustrative readiness only</p></div>`}
function show(id){if(!sections[id])id='overview';window.location.hash=id;document.getElementById('nav').innerHTML=items.map(([key,ico,name])=>`<button class="nav ${key===id?'active':''}" onclick="show('${key}')"><span>${ico}</span>${name}</button>`).join('');document.getElementById('crumb').textContent=items.find(x=>x[0]===id)[2];document.getElementById('app').innerHTML=sections[id]()+`<div class="footnote">CS-IRCFS visual prototype • Values marked sample are fictitious UI placeholders. Confirmed proposal facts are individually marked. No live data, routing, authentication, or SMS functionality is connected.</div>`;document.getElementById('side').classList.remove('show');window.scrollTo(0,0)}window.addEventListener('hashchange',()=>show(location.hash.substring(1)));show(location.hash.substring(1)||'overview');
